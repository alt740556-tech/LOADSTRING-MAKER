<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loady</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#16202b;--mute:#5d6b7a;--line:#cfd7df;--acc:#0d6efd;--accink:#fff;--code:#101820;--codeink:#bfe3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--panel:#16202b;--ink:#e8eef4;--mute:#92a1b1;--line:#2a3846;--acc:#4c9aff;--accink:#06111f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{margin:8px 0 6px}
p.lead,.stat{color:var(--mute)}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
textarea{width:100%;min-height:150px;background:var(--code);color:var(--codeink);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.45 ui-monospace,monospace}
.drop{display:block;border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:10px}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 16px;background:var(--acc);color:var(--accink);cursor:pointer;width:100%;margin-top:10px}
.err{color:#d6336c}
</style>
</head>
<body>
<main>
<h1>Loady</h1>
<p class="lead">Upload your Lua file and get a loadstring that loads it from this site.</p>
<section>
<label class="drop" id="drop" for="file">Tap to choose a .lua or .txt file</label>
<input id="file" type="file" accept=".lua,.luau,.txt,text/plain" hidden>
<textarea id="src" placeholder="…or paste your Lua code here" spellcheck="false"></textarea>
<button id="go">Create loadstring</button>
<p class="err" id="err" role="alert"></p>
</section>
<section id="outsec" hidden>
<textarea id="out" readonly style="min-height:90px"></textarea>
<button id="copy">Copy loadstring</button>
<p class="stat">Anyone with this link can read the script, so don't put secrets in it.</p>
</section>
</main>
<script>
var $=function(i){return document.getElementById(i)};
$("file").addEventListener("change",function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){$("src").value=r.result;$("drop").textContent="Loaded "+f.name};
  r.readAsText(f);
});
$("go").addEventListener("click",function(){
  $("err").textContent="";
  var code=$("src").value;
  if(!code.trim()){$("err").textContent="Add a script first.";return}
  fetch("/api/upload",{method:"POST",headers:{"Content-Type":"text/plain"},body:code})
    .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t)})})
    .then(function(d){
      $("out").value='loadstring(game:HttpGet("'+location.origin+'/raw/'+d.id+'"))()';
      $("outsec").hidden=false;
    })
    .catch(function(e){$("err").textContent=e.message||"Upload failed."});
});
$("copy").addEventListener("click",function(){
  var o=$("out");o.select();
  (navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).catch(function(){document.execCommand("copy")});
  $("copy").textContent="Copied";
  setTimeout(function(){$("copy").textContent="Copy loadstring"},1500);
});
</script>
</body>
</html>
